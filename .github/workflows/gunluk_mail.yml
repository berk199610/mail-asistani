name: Gunluk Mail Analizi

on:
  schedule:
    - cron: '30 6 * * *'  # Tayland 13:30 (UTC 06:30)
  workflow_dispatch:      # Manuel Çalıştırma Butonu

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Cek
      uses: actions/checkout@v3

    - name: Python Kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Kutuphaneleri Yukle
      run: |
        python -m pip install --upgrade pip
        pip install google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client beautifulsoup4 yfinance pandas matplotlib gspread

    - name: Scripti Calistir
      env:
        GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
        GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
        GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        HEDEF_MAIL: ${{ secrets.HEDEF_MAIL }}
        SHEET_ID: ${{ secrets.SHEET_ID }}
      run: python main.py
