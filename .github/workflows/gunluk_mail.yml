name: Gunluk Mail Analizi

on:
  schedule:
    - cron: '30 6 * * *'  # Vietnam saatiyle 13:30 (UTC 06:30)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Günlük analiz veya etiket ve kaynak düzenini uygula'
        type: choice
        default: analyze
        options:
          - analyze
          - labels
          - accounts

concurrency:
  group: gunluk-mail-analizi
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  keep-schedule-active:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Aylik otomasyon bakim kaydi
      shell: bash
      run: |
        # Only a UTC date is committed; no mail, token or report is published.
        heartbeat=.github/automation-heartbeat
        now=$(date -u +%s)
        previous=0
        if [ -f "$heartbeat" ]; then
          previous=$(date -u -d "$(cat "$heartbeat")" +%s 2>/dev/null || echo 0)
        fi
        if [ "$((now - previous))" -ge 2592000 ]; then
          date -u +%Y-%m-%dT%H:%M:%SZ > "$heartbeat"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$heartbeat"
          git commit -m 'chore: record monthly scheduler heartbeat'
          git push
        fi

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Depoyu Cek
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Kutuphaneleri Yukle
      run: |
        python -m pip install --upgrade pip
        pip install google-auth google-auth-oauthlib google-auth-httplib2 \
                    google-api-python-client beautifulsoup4 yfinance \
                    pandas matplotlib gspread

    - name: Scripti Calistir
      env:
        MAIL_MODE: ${{ inputs.mode || 'analyze' }}
        GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
        GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
        GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        HEDEF_MAIL: ${{ secrets.HEDEF_MAIL }}
        SHEET_ID: ${{ secrets.SHEET_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python -u main.py

    - name: Calisma Ozeti
      if: always()
      run: |
        if [ -f run-summary.md ]; then
          cat run-summary.md >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Hata Durumunda Bildirim
      if: failure()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "text=⛔ <b>GitHub Actions Çöktü</b>%0A%0AMail asistanı workflow'u başarısız oldu. GitHub Actions sekmesinden logları kontrol et."
        fi
